# 完整表单；共通字段与同步方式见 docs/development/issue-templates.md。
name: 功能与行为改进
description: 要新增或改变什么产品能力？
title: "[功能] "
body:
- type: markdown
  attributes:
    value: 请说清当前情况、想要的结果与必要边界，具体方法由执行者选择。请设置 Assignees，并按项目流程整理和核对需求。[分类与填写指南](https://github.com/TonQiaN/Agent_flow/blob/main/docs/development/issue-templates.md)。
- type: dropdown
  id: domain
  attributes:
    label: 所属领域
    description: 开发流程：团队开发、协作与维护方法；项目内容：AgentFlow 产品本身的能力、实现与使用说明。按主要验收对象单选；跨领域影响写入“范围与边界”。
    options:
    - 开发流程
    - 项目内容
    multiple: false
  validations:
    required: true
- type: input
  id: owner
  attributes:
    label: 主负责开发者
    description: 填写一名人类主责，并设置 GitHub Assignees；AI/工具可以协助，不能替代责任归属。
    placeholder: "@GitHub 用户名；协作者及分工可另列。"
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 当前场景与期望能力
    description: 说明谁在什么场景遇到什么限制、造成什么影响，以及希望能够完成什么。
    placeholder: |-
      当前场景与问题：
      对使用者的影响：
      希望新增或改变的能力：
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 范围与边界
    description: 说明目标范围、非目标和已有的必要约束及依据；不在这里预设技术选型、内部结构或执行步骤。
    placeholder: |-
      本次希望解决的范围：
      本次不包含的目标：
      必须满足的已有约束及原因（如有）：
  validations:
    required: true
- type: dropdown
  id: deliverables
  attributes:
    label: 预期交付物
    description: 可多选，说明希望收到什么成果；不必提前指定实现文件路径或内部结构，已承诺的成果仍需完成。
    options:
    - 正式决策正文
    - 实现文件（代码 / 配置 / 模板）
    - 当前说明或使用指南
    - 研究 / 验证记录
    multiple: true
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 完成后应看到的结果
    description: 写具体场景下应出现的结果，或希望得到的回答及其质量；不预设实现、研究或测试方法，不用执行过步骤代替目标达成。
    placeholder: |-
      - [ ] 在……情况下，使用者能够…… / 结果表现为……。
      - [ ] 对于……问题，结论说明……及仍存在的限制。
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 依赖与阻塞
    description: 只列已知依赖、缺少的条件及责任归属；区分阻塞与参考。没有已知依赖写“无”，未知项如实说明。
    placeholder: |-
      已知阻塞或缺少的条件：无 / 具体事项
      需要谁提供什么：
      相关参考或父子 Issue（如有）：
  validations:
    required: true
- type: textarea
  id: decision_context
  attributes:
    label: 已知约束与相关决定
    description: 按需补充已有明确要求、依据或相关决定，以及仍需澄清的需求；不要求建项时列出候选方案或作出技术选择。
    placeholder: |-
      已有明确要求与依据：
      相关决定（如有）：
      仍需澄清的需求问题：
  validations:
    required: false
- type: textarea
  id: handoff
  attributes:
    label: 整理与续接记录
    description: 创建时可留空；后续简记需求确认、实际进展和产物定位，不填写执行计划。已有授权不重复询问，实际完成情况如实记录。
    placeholder: |-
      已确认的需求范围、参与者与依据：
      已完成 / 未完成的结果：
      待澄清问题与责任人：
      相关决定、产物或验收记录：
  validations:
    required: false
