# 完整表单；共通字段与同步方式见 docs/development/issue-templates.md。
name: 缺陷与回归修复
description: 什么已约定的行为没有成立？
title: "[缺陷] "
body:
- type: markdown
  attributes:
    value: 提交后按项目流程经人参与整理、预检和确认具体范围。请设置 Assignees；表单填写不代表已经开工或验收。正文须自足，原始材料链接可选。[分类与填写指南](https://github.com/TonQiaN/Agent_flow/blob/main/docs/development/issue-templates.md)。
- type: input
  id: owner
  attributes:
    label: 主负责开发者
    description: 填写一名人类主责，并设置 GitHub Assignees；AI/工具可以协助，不能替代责任归属。
    placeholder: "@GitHub 用户名；协作者及分工可另列。"
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 实际与期望行为
    description: 给出失败现象及现行契约/已确认要求。区分观察与根因猜测，说明影响范围；未确定的期望标为待核对。
    placeholder: |-
      触发条件：
      实际结果：
      期望结果及依据：
      影响：
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 复现步骤与已有证据
    description: 写可执行步骤、最小输入、发生频次及尝试；未复现如实说明缺什么，不把假设写成根因。
    placeholder: |-
      1. ……
      最小输入/已有证据：
      重复次数与失败次数（实际值或未知）：
      已尝试及缺少条件：
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 版本与相关运行条件
    description: 只填与问题相关的提交/版本和条件。AgentFlow 运行问题分开记录 Harness、镜像依赖、节点 skill/MCP 配置与外围
      I/O；不要求 agent 内部会话日志。
    placeholder: |-
      提交 / 产品版本：
      Harness 与版本（适用时）：
      镜像 / 物理依赖（适用时）：
      节点能力配置 / 脱敏输入输出（适用时）：
      未知项：
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 范围与边界
    description: 写明本次交付切片、受影响模块/接口、保留行为与非目标；将必要事实写在正文，原始材料链接自愿提供。
    placeholder: |-
      包含：
      不包含：
      受影响模块/调用方：
      必须保持的行为：
  validations:
    required: true
- type: dropdown
  id: deliverables
  attributes:
    label: 预期交付物
    description: 可多选。每项在验收中指出具体内容/位置；选择“决策”不代表其他已承诺产物可省略。
    options:
    - 正式决策正文
    - 实现文件（代码 / 配置 / 模板）
    - 当前说明或使用指南
    - 研究 / 验证记录
    multiple: true
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 验收标准与验证方式
    description: 列可检查的结果、方法和必要边界，不预填“通过”。研究/决策可以不运行产品测试；实际结果在执行后回填。
    placeholder: |-
      - [ ] 在……条件下，观察到……；以……验证。
      - [ ] 对应交付物……可检查，未知项……有处理结论。
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 依赖与阻塞
    description: 区分阻塞、相关参考和父子拆分。没有外部依赖写“无”；阻塞写所需交付、解除条件与处理人，内部未知项说明何时影响下一步。
    placeholder: |-
      阻塞：无 / 具体事项或 #Issue
      所需交付、解除条件与处理人：
      相关参考：
      父子关系（适用时）：
  validations:
    required: true
- type: textarea
  id: decision_context
  attributes:
    label: 相关决定与待决问题
    description: 可先列候选稳定 ID 与问题，不要求创建时已完成决定。实施前按项目规则核对现行正文、alternatives/rejected；同一问题优先修订原文。
    placeholder: |-
      已有决定 / 当前依据：
      本次可能修订的问题：
      已知分歧或新证据：
  validations:
    required: false
- type: textarea
  id: handoff
  attributes:
    label: 整理与续接记录
    description: 创建时可留空，开始工作、实质变更或交接时补充。保持短摘要；具体确认与验证必须如实，空白不等于批准，已有授权不重复询问。
    placeholder: |-
      当前阶段 / 已完成：
      主责与实际参与分工：
      已确认范围、确认人/日期/依据：
      待决或阻塞与处理人：
      实际基线、证据位置及未验证部分：
      下一步 / 交接位置：
  validations:
    required: false
