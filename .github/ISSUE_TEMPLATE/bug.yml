name: 缺陷修复
description: 记录实际与期望行为、复现条件和可验收的修复目标。
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        提交成功不代表已复现或可开工。请将主负责开发者设置到 Assignees；先经人参与整理与关键确认，AI 和工具可协助补齐信息，再做复现与决策预检，无法复现时保留证据不足的事实。
  - type: input
    id: owner
    attributes:
      label: 主负责开发者
      description: 填写负责调查、修复及验收跟进的 GitHub 用户名。
      placeholder: "@username"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际与期望行为
      description: 说明触发条件、实际结果、期望结果及影响；期望已有文档依据时列出对应位置。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与已有证据
      description: 写出步骤、输入和观察结果。未知或偶发时说明已尝试什么，不能把猜测写成已复现。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 列出相关提交或版本、环境、配置条件；未知项明确说明。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 界定本次调查或修复的边界，不将无关重构混入修复。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 说明如何确认缺陷得到修复，以及需要保持的既有行为。
      placeholder: |
        - [ ] 原触发条件下得到……结果；通过……验证。
        - [ ] 相关既有行为……仍然成立。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与阻塞
      description: 列出前置工作、缺少的环境或证据；无已知依赖时明确写“无”。
    validations:
      required: true
  - type: textarea
    id: decision_context
    attributes:
      label: 相关决定与已知疑问
      description: 列出已有行为依据或疑似冲突；恢复既有行为与改变取舍由预检后负责开发者区分。
    validations:
      required: false
