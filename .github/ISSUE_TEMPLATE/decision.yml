# 主 Issue 完整表单；共通字段与同步方式见 docs/development/issue-templates.md。
name: 主 Issue：方案与决策讨论
description: 团队现在需要选定什么及其边界？
title: "[决策] "
body:
- type: markdown
  attributes:
    value: 本表用于主 Issue：请说清当前情况、想要的结果与必要边界，无需提前给出实现方法。请设置 Assignees，后续经人参与整理并确认具体范围。Sub-issue 的内容与形式由对应负责人自主决定，当前不提供模板或写作建议。[分类与填写指南](https://github.com/TonQiaN/Agent_flow/blob/main/docs/development/issue-templates.md)。
- type: dropdown
  id: domain
  attributes:
    label: 所属领域
    description: 本项主要讨论团队的开发与协作方式，还是 AgentFlow 产品本身？请选择一个领域，交叉影响在范围中说明。
    options:
    - 开发流程
    - 项目内容
    multiple: false
  validations:
    required: true
- type: input
  id: owner
  attributes:
    label: 主负责开发者
    description: 填写一名人类主责，并设置 GitHub Assignees；AI/工具可以协助，不能替代责任归属。
    placeholder: "@GitHub 用户名；协作者及分工可另列。"
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 当前情况与需要作出的选择
    description: 说明为何现在需要选择、影响谁、已经确认什么，以及还希望解决什么问题。
    placeholder: |-
      当前情况：
      已经确认的要求：
      需要作出的选择及用途：
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 范围与边界
    description: 说明本次包含和不包含什么，以及必须满足的真实约束与依据。
    placeholder: |-
      包含：
      不包含：
      必须满足的约束及依据：
  validations:
    required: true
- type: dropdown
  id: deliverables
  attributes:
    label: 预期交付物
    description: 可多选。每项在验收中指出具体内容/位置；选择“决策”不代表其他已承诺产物可省略。
    options:
    - 正式决策正文
    - 实现文件（代码 / 配置 / 模板）
    - 当前说明或使用指南
    - 研究 / 验证记录
    multiple: true
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 完成后应看到的结果
    description: 列出能判断需求已满足的结果或结论质量，不要求提前确定实现或验证方法。真实约束写清依据。
    placeholder: |-
      - [ ] 在……情况下，应当看到……
      - [ ] 交付的……能够说明／满足……
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 依赖与阻塞
    description: 说明影响开工或交付的外部条件与所需结果；没有依赖写“无”。相关参考和父子关系与阻塞分别表达。
    placeholder: |-
      依赖或阻塞：无 / 具体事项
      所需结果与相关负责人：
      相关 Issue 或参考：
  validations:
    required: true
- type: textarea
  id: decision_context
  attributes:
    label: 已知约束与相关决定
    description: 可列已确认要求、依据和已有决定，也可留下尚需澄清的问题；不要求建项时完成方案选择。
    placeholder: |-
      已确认要求及依据：
      相关决定：
      仍需澄清的问题：
  validations:
    required: false
- type: textarea
  id: handoff
  attributes:
    label: 整理与续接记录
    description: 创建时可留空，后续记录实际确认、进展和关联位置。只写真实发生的情况，已有授权不重复询问。
    placeholder: |-
      已确认范围与依据：
      已完成 / 未完成：
      实际参与者与关联交付：
      当前阻塞：
  validations:
    required: false
