name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Prepare Docker test images
        run: |
          docker pull alpine:3
          docker pull node:22-bookworm-slim
      - run: npm run check
        env:
          AGENTFLOW_DOCKER_TESTS: '1'
