name: Check
on:
  push:
  pull_request:
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Prepare Docker test images
        run: |
          docker pull alpine:3
          docker pull node:22-bookworm-slim
          docker build -f src/apps/studio/docker/Dockerfile.documents -t agentflow/studio-documents:issue39 .
      - run: npm run check
        env:
          AGENTFLOW_DOCKER_TESTS: '1'
          AGENTFLOW_STUDIO_TESTS: '1'
  studio-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare offline material parsing and browser
        run: |
          docker build -f src/apps/studio/docker/Dockerfile.documents -t agentflow/studio-documents:issue39 .
          npx playwright install --with-deps chromium
      - name: Verify the user journey against the real local service
        run: npm run studio:test
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 14
